[workspace]
members = ["server", "play"]
resolver = "3"

# Keep debug builds small: the disk is tight and we rarely need a debugger.
[profile.dev]
debug = "line-tables-only"
incremental = false # saves ~750 MB of cache

[profile.dev.package."*"]
debug = false
opt-level = 1

# Server builds. Unwinding (the default) keeps one game's panic from taking the server down.
[profile.release]
opt-level = 2
strip = true
