name: CI

on:
  pull_request:
    branches: [main]
    # Draft PRs start no jobs; marking a PR ready for review runs CI. Converting it
    # back to draft starts an empty run that cancels any CI still in progress.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A manual diagnostic run must never cancel the push CI that authorizes release.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Ready PRs only: skips the web and Rust jobs when the head commit records local
  # checks on its exact tree (scripts/local-ci.sh) or the PR has the skip-ci label,
  # and skips the Rust job alone when only web files changed.
  # Pushes to main and manual runs never consult it; push CI is the release gate.
  gate:
    name: Local CI gate
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Same backend as the other jobs, so a hosted billing block can't stop it on saget.
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","yama-ci"]') }}
    timeout-minutes: ${{ contains(vars.CI_LINUX_RUNNER || 'self-hosted', 'self-hosted') && 360 || 5 }}
    # A gate failure never fails CI: the web and Rust jobs then simply run.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - name: Wait for saget CI capacity
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      # main's gate decides, never the copy in the PR under test.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: scripts/ci/gate.py
          sparse-checkout-cone-mode: false
      - name: Decide whether local checks cover this PR
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python3 scripts/ci/gate.py

  web:
    name: Web checks
    needs: gate
    # A skipped gate (push, manual run) or a failed one runs the job; only an
    # explicit skip from the gate, a draft or a fork PR does not.
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.gate.outputs.skip != 'true'))
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","yama-ci"]') }}
    timeout-minutes: ${{ contains(vars.CI_LINUX_RUNNER || 'self-hosted', 'self-hosted') && 360 || 15 }}
    steps:
      - name: Wait for saget CI capacity
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Node on GitHub-hosted runners
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Check Node
        run: |
          node --version
          test "$(node -p 'process.versions.node.split(".")[0]')" = 22
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  rust:
    name: Rust and Python tests
    needs: gate
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (!github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        needs.gate.outputs.skip != 'true' &&
        needs.gate.outputs.rust != 'false'))
    runs-on: ${{ fromJSON(vars.CI_LINUX_RUNNER || '["self-hosted","Linux","X64","yama-ci"]') }}
    timeout-minutes: ${{ contains(vars.CI_LINUX_RUNNER || 'self-hosted', 'self-hosted') && 360 || 90 }}
    defaults:
      run:
        working-directory: yama
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - name: Wait for saget CI capacity
        if: runner.environment == 'self-hosted'
        working-directory: ${{ runner.temp }}
        run: |
          test "${SAGET_CI_SLOT_PROTOCOL:-}" = step-v1
          python3 /run/saget-ci/slot.py --step
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: yama
          persist-credentials: false
      - name: Read the published Phase pin
        id: phase
        env:
          PHASE_KEY: ${{ secrets.YAMA_PHASE_DEPLOY_KEY }}
        run: |
          if [ -z "$PHASE_KEY" ]; then
            echo '::error::Configure YAMA_PHASE_DEPLOY_KEY with read-only access to bryanroscoe/yama-phase; see docs/ci.md.'
            exit 1
          fi
          test "$(cat deploy/phase-repo)" = 'https://github.com/bryanroscoe/yama-phase.git'
          revision="$(cat deploy/phase-rev)"
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::deploy/phase-rev must contain one full commit SHA.'
            exit 1
          fi
          echo "sha=$revision" >> "$GITHUB_OUTPUT"
      - name: Check out the private pinned engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: bryanroscoe/yama-phase
          ref: ${{ steps.phase.outputs.sha }}
          path: yama-phase
          ssh-key: ${{ secrets.YAMA_PHASE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Prepare GitHub-hosted Rust and build memory
        if: runner.environment == 'github-hosted'
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          echo 'RUSTUP_TOOLCHAIN=1.98.1' >> "$GITHUB_ENV"
          # The hosted image leaves ~4 GiB free; drop toolsets CI never uses so the
          # restored cache, the build and the swapfile fit.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          # Only the disposable hosted VM may create swap. Saget has no sudo.
          sudo fallocate -l 8G /swapfile-yama-ci
          sudo chmod 600 /swapfile-yama-ci
          sudo mkswap /swapfile-yama-ci
          sudo swapon /swapfile-yama-ci
      # Cargo judges path dependencies by file time, and a fresh checkout is always
      # newer than a cached build. Dating the engine's files to its commit lets the
      # cached engine build count as fresh; the cache key holds the engine revision.
      - name: Date the engine's files to its commit
        if: runner.environment == 'github-hosted'
        working-directory: yama-phase
        run: |
          stamp="$(git log -1 --format=%ct)"
          git ls-files -z | xargs -0 touch -h -d "@$stamp"
      # Hosted VMs start empty; restore dependency and engine builds from main.
      # Only push CI on main saves, so PRs never evict main's cache.
      - name: Restore the Rust build cache
        if: runner.environment == 'github-hosted'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: yama -> target
          key: phase-${{ steps.phase.outputs.sha }}
          # rust-cache counts ../yama-phase as a workspace crate (its path starts with
          # this workspace's path), so keep workspace crates or the engine is dropped.
          cache-workspace-crates: 'true'
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - name: Check Rust and dedicated cache
        run: |
          test "${RUSTUP_TOOLCHAIN:-}" = 1.98.1
          if [ "$RUNNER_ENVIRONMENT" = self-hosted ]; then
            test "${CARGO_TARGET_DIR:-}" = /ci-cache/target
          fi
          rustc --version
          free -h
          df -h .
          if [ -n "${CARGO_TARGET_DIR:-}" ]; then df -h "$CARGO_TARGET_DIR/.."; fi
      - name: Test the Rust workspace
        run: |
          git log -1 --format='Tested Yama revision: %H'
          git -C ../yama-phase log -1 --format='Tested Phase revision: %H'
          vmstat -w 30 &
          ci_monitor_pid=$!
          trap 'kill "$ci_monitor_pid" 2>/dev/null || true' EXIT
          /usr/bin/time -v cargo test --locked --timings
      - name: Show where Rust build time went
        if: always()
        run: python3 scripts/ci/build_timings.py "${CARGO_TARGET_DIR:-target}"
      - name: Report runner resources
        if: always()
        run: |
          free -h
          df -h .
          swapon --show
          for counter in /sys/fs/cgroup/memory.events /sys/fs/cgroup/memory.peak; do
            if [ -r "$counter" ]; then
              echo "$counter"
              cat "$counter"
            fi
          done
      - name: Test release guards
        run: |
          python3 deploy/test_release.py
          python3 deploy/test_host.py
      - name: Test portable workers and build identity
        run: python3 -m unittest discover -s tools -p 'test_lab*.py'
      - name: Test the Forge worker
        run: python3 forge-worker/test_worker.py
      - name: Test the CI gate and local CI script
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Test commander evidence and list validation
        run: python3 -m unittest discover -s scripts/research -p 'test_*.py'
      - name: Test dataset recovery conversion
        run: python3 -m unittest discover -s scripts/datasets -p 'test_*.py'
      - name: Test list validation with Python optimization enabled
        run: python3 -O -m unittest discover -s scripts/research -p 'test_*.py'
