name: Android

# Checks that the Android app (web/android, Capacitor) builds, on GitHub-hosted runners, which
# come with the Android SDK; the Mac's disk is kept for other work. Every run uploads a debug APK
# to install by hand and an unsigned release bundle. Signed releases come from android-release.yml
# after each production deploy (docs/mobile.md, "Updates").
# Automatic PR builds follow the CI_TESTS switch (docs/ci.md); a manual run always builds.
on:
  pull_request:
    branches: [main]
    paths: ['web/android/**', 'web/capacitor.config.ts', 'web/src/native.ts', 'web/package.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build the Android app
    if: vars.CI_TESTS == 'on' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      # Capacitor 8 needs JDK 21.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci --no-audit --no-fund
      # The web build for https://yama.ing, copied into the Android project.
      - run: npm run android:sync -w web
      - name: Build
        working-directory: web/android
        env:
          YAMA_ANDROID_VERSION_CODE: ${{ github.run_number }}
          YAMA_ANDROID_VERSION_NAME: 0.1.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug bundleRelease
      - name: Signing certificates (for the Android OAuth clients)
        working-directory: web/android
        run: ./gradlew --no-daemon -q signingReport | grep -E '^(Variant|Config|SHA1|Store)' || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yama-android-${{ github.run_number }}
          path: |
            web/android/app/build/outputs/apk/debug/app-debug.apk
            web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
