<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Small choices on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--warn:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.65)"></div>

  <div role="alert" style="position: absolute; left: 8px; right: 8px; top: 8px; padding: 10px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--line), 0 16px 40px rgb(0 0 0 / 0.6); display: flex; flex-direction: column; gap: 8px">
    <div style="display: flex; gap: 10px; align-items: center">
      <img src="/_blob/a3e58275bd2364af6a346bbf2e6a38b9" alt="" style="width: 48px; height: 36px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.2"><b style="font-size: 15px">Pay {1} for Rhystic Study?</b><span style="font-size: 12px; color: var(--dim)">Otherwise Jules draws. Art: Tatiana Kirgetova</span></span>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <button style="min-height: 44px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Don’t pay</button>
      <button style="min-height: 44px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 14px">Pay {1}</button>
    </div>
  </div>
  <span style="position: absolute; left: 16px; top: 146px; font-size: 12px; color: var(--dim)">A yes-or-no prompt drops in from the top. A bigger choice opens as a sheet:</span>

  <section role="dialog" aria-label="Discard down to 7" style="position: absolute; left: 0; right: 0; bottom: 0; top: 176px; padding: 8px 14px 16px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: flex; justify-content: space-between; align-items: end"><b style="font-family: var(--display); font-size: 28px; font-weight: 800; line-height: 1">Discard down to 7</b><span style="font-size: 13px; color: var(--dim)">Pick 2</span></div>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; padding-top: 6px">
      <sc-for list="{{hand}}" as="h" hint-placeholder-count="9">
        <button onClick="{{h.pick}}" aria-pressed="{{h.on}}" aria-label="{{h.name}}" style="position: relative; padding: 0; border: none; background: transparent">
          <img src="{{h.img}}" alt="" style="display: block; width: 100%; border-radius: 5px; box-shadow: {{h.ring}}">
          <sc-if value="{{h.on}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: -9px; transform: translateX(-50%); padding: 0 8px; border-radius: 999px; background: var(--warn); color: var(--ground); font-size: 11px; font-weight: 800">Discard</span></sc-if>
        </button>
      </sc-for>
    </div>
    <button style="margin-top: auto; min-height: 54px; border-radius: 999px; border: none; background: {{discBg}}; color: {{discInk}}; font-weight: 800; font-size: 17px">Discard ({{discN}}/2)</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { disc: ['fortress', 'clifftop'] };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const hand = [
      ['fortress', 'Glacial Fortress', 'e25b0374571373f1ab95c0e88cd1758e'], ['clifftop', 'Clifftop Retreat', '4b6f8a8ccbd66b04717e915e9e659b37'],
      ['charm', 'Boros Charm', '2d80527eb5c346c24b35ad5381fe99a6'], ['warp', 'Chaos Warp', '0145ecf81c21d180a7799470623719f7'],
      ['will', 'Akroma’s Will', 'd2df35f8a45cc092aadf237d7374fc27'], ['fierce', 'Fierce Guardianship', 'c858d7cf7a488b3218bd7bbf1fe8b79c'],
      ['rift', 'Cyclonic Rift', '4e274a0a80fefd3f3346bd10c98c1349'], ['sunfall', 'Sunfall', '4f17f1f93dbb25c0d47e2fcb9b2c0ae6'],
      ['maneuver', 'Flawless Maneuver', '2b7584e35f9b697ba24e7b43dae7b869']
    ];
    const disc = this.state.disc;
    return {
      hand: hand.map(([id, name, img]) => {
        const on = disc.includes(id);
        return { name, img: A(img), on, ring: on ? '0 0 0 3px #f0b45a' : 'none',
          pick: () => this.setState((s) => ({ disc: s.disc.includes(id) ? s.disc.filter((x) => x !== id) : s.disc.length < 2 ? s.disc.concat(id) : s.disc.slice(1).concat(id) })) };
      }),
      discN: disc.length, discBg: disc.length === 2 ? '#f2efe8' : '#1e2125', discInk: disc.length === 2 ? '#0b0c0e' : '#a9adb3'
    };
  }
}
</script>
</body>
</html>
