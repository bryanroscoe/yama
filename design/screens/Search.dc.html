<style>

*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#f2efe8}a:hover{color:#ffffff}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2efe8;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; display: flex; flex-wrap: wrap; background: var(--ground)">

    <a href="Play.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; color: var(--dim); font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="8" height="12" rx="1.5" transform="rotate(-8 7 12)"></rect><rect x="13" y="6" width="8" height="12" rx="1.5" transform="rotate(8 17 12)"></rect></svg>Play</a>
    <a href="Search.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; background: var(--raised); color: var(--text); font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>Cards</a>

    <a href="Group.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 12px; border-radius: 12px; color: var(--dim); font-weight: 700; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>Group</a>

  </nav>

  <main style="flex: 999 1 560px; min-width: 0; padding: 40px clamp(20px, 4vw, 56px) 72px">
    <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
      <h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 0.9">Cards</h1>

      <form role="search" style="display: flex; flex-wrap: wrap; gap: 10px">
        <label style="flex: 1 1 380px; position: relative; display: block">
          <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search cards</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#a9adb3" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="position: absolute; left: 18px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>
          <input type="search" value="id<=wur t:creature o:create" autocapitalize="off" style="width: 100%; min-height: 56px; padding: 10px 18px 10px 50px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-family: var(--mono); font-size: 17px">
        </label>
        <select aria-label="Sort by" style="min-height: 56px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 16px">
          <option>Most played</option><option>Name</option><option>Mana value</option><option>Price</option>
        </select>
      </form>

      <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px">
        <span style="color: var(--dim)">48 creatures that</span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--raised); font-size: 14px">fit white, blue, red<button aria-label="Remove" style="width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent; color: var(--dim)">×</button></span>
        <span style="display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 12px; border-radius: 999px; background: var(--raised); font-size: 14px">say "create"<button aria-label="Remove" style="width: 24px; height: 24px; border: none; border-radius: 50%; background: transparent; color: var(--dim)">×</button></span>
        <span style="margin-left: auto; font-size: 13px; color: var(--dim)">Prices: TCGplayer market via Scryfall, Oct 19</span>
      </div>

      <ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(172px, 100%), 1fr)); gap: 22px 16px">
        <sc-for list="{{cards}}" as="c" hint-placeholder-count="12">
          <li style="display: flex; flex-direction: column; gap: 8px">
            <a href="CardPage.dc.html" aria-label="{{c.name}}" style="display: block; border-radius: 4.75% / 3.4%; overflow: hidden; box-shadow: 0 10px 24px rgb(0 0 0 / 0.4)"><img src="{{c.img}}" alt="{{c.name}}" style="display: block; width: 100%; aspect-ratio: 488 / 680"></a>
            <span style="display: flex; justify-content: space-between; gap: 8px; font-size: 14px">
              <span style="color: {{c.ownInk}}; font-weight: 700">{{c.own}}</span>
              <span style="color: var(--dim); font-variant-numeric: tabular-nums">{{c.price}}</span>
            </span>
          </li>
        </sc-for>
      </ul>

      <nav aria-label="Pages" style="display: flex; align-items: center; justify-content: center; gap: 12px">
        <button disabled style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: var(--surface); color: var(--dim); font-weight: 700">Previous</button>
        <span style="color: var(--dim)">Page 1 of 4</span>
        <button style="min-height: 44px; padding: 0 18px; border-radius: 999px; border: none; background: var(--raised); font-weight: 700">Next</button>
      </nav>
    </div>
  </main>
</div>
</x-dc>
