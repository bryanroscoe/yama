<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Responding on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--sam:#e8bae4;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.6)"></div>

  <figure style="position: absolute; left: 0; right: 0; top: 70px; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 10px">
    <img src="/_blob/0145ecf81c21d180a7799470623719f7" alt="Chaos Warp" style="width: 190px; border-radius: 9px; box-shadow: 0 0 0 3px #e8bae4, 0 30px 60px rgb(0 0 0 / 0.8)">
    <figcaption style="display: flex; align-items: center; gap: 8px; padding: 5px 12px 5px 5px; border-radius: 999px; background: var(--ground); box-shadow: 0 0 0 1px var(--line); font-size: 14px; font-weight: 700"><img src="/_blob/7678674b257c9f2d67041ed3a4ee2ab4" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover">Sam targets your Éowyn</figcaption>
  </figure>

  <section aria-label="Respond" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 12px 16px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <b style="font-size: 17px">Respond?</b>
      <span style="padding: 3px 10px; border-radius: 999px; background: var(--raised); font-size: 12px; font-weight: 700">Stack 1</span>
    </div>
    <button style="display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 58px; padding: 6px 10px 6px 6px; border-radius: 14px; border: 1px solid #f0b45a; background: var(--raised); text-align: left">
      <img src="/_blob/c858d7cf7a488b3218bd7bbf1fe8b79c" alt="" style="width: 46px; border-radius: 3px">
      <span style="display: flex; flex-direction: column; line-height: 1.2"><b style="font-size: 14px">Fierce Guardianship</b><span style="font-size: 12px; color: var(--dim)">Costs {0} now</span></span>
    </button>
    <button style="display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 58px; padding: 6px 10px 6px 6px; border-radius: 14px; border: 1px solid #f0b45a; background: transparent; text-align: left">
      <img src="/_blob/4e274a0a80fefd3f3346bd10c98c1349" alt="" style="width: 46px; border-radius: 3px">
      <span style="display: flex; flex-direction: column; line-height: 1.2"><b style="font-size: 14px">Cyclonic Rift</b><span style="font-size: 12px; color: var(--dim)">Costs {1}{U}</span></span>
    </button>
    <span style="font-size: 12px; color: var(--dim)">And 1 more in your hand. Long-press any card to read it.</span>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px">
      <button style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Pass options</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 17px">Let it resolve</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
