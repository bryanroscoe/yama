<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sam's phone at the table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#f2efe8}a:hover{color:#ffffff}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2efe8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #000">
  <ul aria-label="Everyone else" style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{others}}" as="o" hint-placeholder-count="3">
      <li style="position: relative; height: 112px; border-radius: 16px; overflow: hidden; box-shadow: {{o.ring}}">
        <img src="{{o.art}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / 0.25), rgb(0 0 0 / 0.7))"></div>
        <span style="position: absolute; left: 10px; right: 10px; bottom: 8px; display: flex; justify-content: space-between; align-items: end; line-height: 1">
          <span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 12px; color: #d5d7db">{{o.note}}</span><span style="font-size: 14px; font-weight: 700">{{o.name}}</span></span>
          <b style="font-family: var(--display); font-weight: 700; font-size: 38px; font-variant-numeric: tabular-nums">{{o.life}}</b>
        </span>
      </li>
    </sc-for>
  </ul>

  <section aria-label="Sam, 31 life" style="flex: 1; position: relative; overflow: hidden; border-radius: 24px">
    <img src="/_blob/042e4cb280a5a896fb249a47c8f4a8a3" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: radial-gradient(75% 60% at 50% 48%, rgb(0 0 0 / 0.55) 0%, rgb(0 0 0 / 0.25) 70%, rgb(0 0 0 / 0.55) 100%)"></div>
    <button aria-label="Sam gains 1 life" style="position: absolute; left: 0; right: 0; top: 0; height: 50%; border: none; background: transparent; color: #fff; display: flex; align-items: start; justify-content: center; padding-top: 70px; font-family: var(--display); font-size: 48px"><span aria-hidden="true" style="opacity: 0.6">+</span></button>
    <button aria-label="Sam loses 1 life" style="position: absolute; left: 0; right: 0; bottom: 0; height: 50%; border: none; background: transparent; color: #fff; display: flex; align-items: end; justify-content: center; padding-bottom: 86px; font-family: var(--display); font-size: 48px"><span aria-hidden="true" style="opacity: 0.6">−</span></button>
    <span style="position: absolute; top: 18px; left: 18px; display: flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 999px; background: rgb(0 0 0 / 0.6); font-size: 14px; font-weight: 700"><img src="/_blob/383d04a073378ede76b3234038a68757" alt="" style="width: 24px; height: 24px; border-radius: 50%; object-fit: cover">6 from Jules</span>
    <span style="position: absolute; top: 18px; right: 18px; padding: 4px 12px; border-radius: 999px; background: rgb(0 0 0 / 0.6); font-size: 14px; font-weight: 700">Tax +2</span>
    <div style="position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none">
      <span aria-live="polite" style="position: relative; font-family: var(--display); font-weight: 700; font-size: 220px; line-height: 0.8; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; text-shadow: 0 4px 30px rgb(0 0 0 / 0.5)">31<span style="position: absolute; left: 100%; top: 0.05em; margin-left: 4px; padding: 0 10px; border-radius: 999px; background: rgb(0 0 0 / 0.6); font-size: 36px; letter-spacing: 0">−3</span></span>
    </div>
    <button style="position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); min-height: 44px; padding: 4px 18px; border: none; border-radius: 999px; background: rgb(0 0 0 / 0.55); color: #fff; display: flex; flex-direction: column; align-items: center; line-height: 1.2; white-space: nowrap">
      <span style="font-weight: 700">Sam</span>
      <span style="font-size: 12px; color: #d5d7db">Quintorius, History Chaser</span>
    </button>
    <span style="position: absolute; right: 14px; bottom: 8px; font-size: 10px; color: rgb(255 255 255 / 0.75)">Art: Darren Tan, © Wizards of the Coast</span>
  </section>

  <p role="status" style="margin: 0; padding: 6px 4px 4px; font-size: 13px; color: var(--dim); display: flex; align-items: center; justify-content: center; gap: 8px"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--good)"></span>Following Bryan's phone. Your taps go to the table.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      others: [
        { name: 'Bryan', note: 'Their turn', life: 40, art: '/_blob/c19490e7c081fb35071c85147c01bed4', ring: 'inset 0 0 0 3px #f2efe8' },
        { name: 'Jules', note: 'Across', life: 27, art: '/_blob/383d04a073378ede76b3234038a68757', ring: 'none' },
        { name: 'Priya', note: '2 poison', life: 36, art: '/_blob/7678674b257c9f2d67041ed3a4ee2ab4', ring: 'none' }
      ]
    };
  }
}
</script>
</body>
</html>
