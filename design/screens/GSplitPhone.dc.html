<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Split a number on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--pick:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.65)"></div>

  <section role="dialog" aria-label="{{prompt}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 230px; padding: 8px 12px 14px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 10px; align-items: center">
      <img src="{{srcArt}}" alt="" style="width: 56px; height: 42px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.15"><b style="font-family: var(--display); font-size: 26px; font-weight: 800">{{prompt}}</b><span style="font-size: 11px; color: var(--dim)">Arc Lightning. Art: Seb McKinnon, © Wizards of the Coast</span></span>
      <span style="display: flex; flex-direction: column; align-items: end; line-height: 1"><b style="font-family: var(--display); font-weight: 800; font-size: 34px; color: {{leftInk}}">{{left}}</b><span style="font-size: 11px; color: var(--dim)">left</span></span>
    </div>
    <span style="font-size: 12px; color: var(--dim)">{{oracle}}</span>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; background: var(--raised)">
          <span style="display: flex; flex-direction: column; line-height: 1.25; min-width: 0"><b style="font-size: 15px">{{r.name}} <span style="font-weight: 400; color: var(--dim)">{{r.pt}}</span></b><span style="font-size: 12px; color: var(--dim); display: flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{r.seat}}"></span>{{r.controller}}. Lethal {{r.toughness}}</span><span style="align-self: flex-start; margin-top: 4px; padding: 0 8px; border-radius: 999px; background: {{r.tagBg}}; color: var(--ground); font-size: 11px; font-weight: 800">{{r.tag}}</span></span>
          <span style="display: flex; align-items: center; gap: 4px">
            <button onClick="{{r.down}}" aria-label="One less to {{r.name}}" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--ground); font-size: 22px; color: {{r.downInk}}">−</button>
            <output aria-live="polite" style="width: 40px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1">{{r.n}}</output>
            <button onClick="{{r.up}}" aria-label="One more to {{r.name}}" style="width: 48px; height: 48px; border-radius: 50%; border: none; background: var(--ground); font-size: 22px; color: {{r.upInk}}">+</button>
          </span>
        </div>
      </sc-for>
    </div>
    <button onClick="{{reset}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Reset to the default split</button>
    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px">
      <button style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Cancel</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: {{primaryBg}}; color: {{primaryInk}}; font-weight: 800; font-size: 16px">{{primary}}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The engine's pending decision, as the builder's payload describes it
  pending() {
    const A = (id) => '/_blob/' + id;
    return {
      kind: 'split',
      source: { name: 'Arc Lightning', art: A('9187cacbbe1017c5aef8b20a43821003'), artist: 'Seb McKinnon', image: A('8dc15a9878b1f6566fcac79fa5d5d3b0') },
      prompt: 'Divide 3 damage',
      oracle: 'Arc Lightning deals 3 damage divided as you choose among one, two, or three targets.',
      options: [
        { id: 'z1', name: 'Zombie', pt: '2/2', toughness: 2, zone: 'battlefield', controller: 'Sam', seat: '#e8bae4' },
        { id: 'sp', name: 'Spirit', pt: '3/2', toughness: 2, zone: 'battlefield', controller: 'Computer', seat: '#b55af6' }
      ],
      total: 3, perOptionMin: 1, defaultAnswer: { z1: 2, sp: 1 }
    };
  }
  constructor(props) {
    super(props);
    this.state = { a: { ...this.pending().defaultAnswer } };
  }
  renderVals() {
    const d = this.pending();
    const a = this.state.a;
    const left = d.total - d.options.reduce((n, o) => n + (a[o.id] || 0), 0);
    const set = (id, v) => this.setState((s) => {
      const others = d.options.reduce((n, o) => n + (o.id === id ? 0 : s.a[o.id] || 0), 0);
      return { a: { ...s.a, [id]: Math.max(d.perOptionMin, Math.min(d.total - others, v)) } };
    });
    return {
      srcArt: d.source.art, prompt: d.prompt, oracle: d.oracle, left, leftInk: left === 0 ? '#8fd3a8' : '#f2efe8',
      rows: d.options.map((o) => {
        const n = a[o.id] || 0;
        return { ...o, n, tag: n >= o.toughness ? 'Dies' : n + ' damage', tagBg: n >= o.toughness ? '#8fd3a8' : '#a9adb3',
          downInk: n > d.perOptionMin ? '#f2efe8' : '#2a2e33', upInk: left > 0 ? '#f2efe8' : '#2a2e33',
          down: () => set(o.id, n - 1), up: () => set(o.id, n + 1) };
      }),
      reset: () => this.setState({ a: { ...d.defaultAnswer } }),
      primary: left === 0 ? 'Done' : left + ' left to assign',
      primaryBg: left === 0 ? '#f2efe8' : '#1e2125', primaryInk: left === 0 ? '#0b0c0e' : '#a9adb3'
    };
  }
}
</script>
</body>
</html>
