<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My runs</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--warn:#f0b45a;--bad:#f07a62;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#f2efe8}a:hover{color:#ffffff}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2efe8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1000px; position: relative; background: var(--ground); padding: 16px 16px 40px; display: flex; flex-direction: column; gap: 16px">
  <div style="display: flex; align-items: center; gap: 10px">
    <a href="LabPhone.dc.html" aria-label="Back to the lab" style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface); display: grid; place-items: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 0.9">My runs</h1>
  </div>
  <sc-for list="{{runs}}" as="r" hint-placeholder-count="4">
    <article style="padding: 14px; border-radius: 18px; background: var(--surface); display: flex; flex-direction: column; gap: 8px">
      <div style="display: flex; justify-content: space-between; gap: 10px; align-items: start">
        <span style="display: flex; flex-direction: column; line-height: 1.25"><b>{{r.title}}</b><span style="font-size: 13px; color: var(--dim)">{{r.meta}}</span></span>
        <span style="padding: 3px 10px; border-radius: 999px; background: {{r.tagBg}}; color: {{r.tagInk}}; font-size: 12px; font-weight: 700; white-space: nowrap">{{r.tag}}</span>
      </div>
      <sc-if value="{{r.running}}" hint-placeholder-val="{{false}}">
        <span role="progressbar" aria-label="Games played" aria-valuenow="130" aria-valuemin="0" aria-valuemax="400" style="height: 8px; border-radius: 999px; background: var(--raised); position: relative"><span style="position: absolute; left: 0; top: 0; bottom: 0; width: 32.5%; border-radius: 999px; background: var(--text)"></span></span>
      </sc-if>
      <span style="font-size: 15px">{{r.result}}</span>
      <span style="display: flex; gap: 8px">
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: var(--raised); font-size: 14px; font-weight: 700">{{r.action}}</button>
        <button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: none; background: transparent; color: var(--dim); font-size: 14px; font-weight: 700">Delete</button>
      </span>
    </article>
  </sc-for>
  <p style="margin: 0; font-size: 12px; color: var(--dim)">Runs use phase-rs v0.113.0 with the easy AI on saget. Simulated games, not your table.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      runs: [
        { title: 'Riders now, with 2 swaps', meta: 'Similar power field, 400 games, started 9:40 pm', tag: 'Running', tagBg: '#1e2125', tagInk: '#f2efe8', running: true, result: '130 of 400 games. Can’t tell yet.', action: 'Open' },
        { title: 'Riders stock vs after prints', meta: 'Field of 161 decks, 55 paired pods, 19 Oct', tag: 'Probably better', tagBg: 'rgb(143 211 168 / 0.15)', tagInk: '#8fd3a8', running: false, result: '+16.4 points, 90% interval +1.8 to +30.9.', action: 'Run again' },
        { title: 'Riders now vs after prints', meta: 'Field of 161 decks, 56 paired pods, 19 Oct', tag: 'Can’t tell yet', tagBg: 'rgb(240 180 90 / 0.14)', tagInk: '#f0b45a', running: false, result: '+12.5 points, 90% interval −3.6 to +28.6. Run more games.', action: 'Run 400 more' },
        { title: 'Riders stock vs now', meta: 'Field of 161 decks, 55 paired pods, 19 Oct', tag: 'Can’t tell yet', tagBg: 'rgb(240 180 90 / 0.14)', tagInk: '#f0b45a', running: false, result: '+3.6 points, 90% interval −9.1 to +16.4.', action: 'Run 400 more' }
      ]
    };
  }
}
</script>
</body>
</html>
