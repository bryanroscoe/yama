<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Collection on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:#f2efe8}a:hover{color:#ffffff}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #f2efe8;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; min-height: 1200px; position: relative; background: var(--ground); padding: 20px 16px 96px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 48px; line-height: 0.9">Collection</h1>
    <span style="display: flex; align-items: baseline; gap: 10px"><b style="font-family: var(--display); font-weight: 700; font-size: 44px; line-height: 1">$1,284</b><span style="font-size: 13px; color: var(--dim)">2,412 cards, Oct 19</span></span>
    <span style="font-size: 13px; color: var(--dim)">37 cards have no price and aren't counted.</span>
  </div>
  <div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px">
    <a href="Scan.dc.html" style="min-height: 52px; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--text); color: var(--ground); font-weight: 700; text-decoration: none">Scan cards</a>
    <button style="min-height: 52px; padding: 0 18px; border-radius: 999px; border: none; background: var(--raised); font-weight: 700">Import</button>
  </div>

  <section aria-labelledby="bx" style="display: flex; flex-direction: column; gap: 10px">
    <h2 id="bx" style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px">Where they live</h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{boxes}}" as="b" hint-placeholder-count="4">
        <button style="position: relative; height: 108px; padding: 10px; border: {{b.border}}; border-radius: 16px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; justify-content: end; text-align: left">
          <sc-if value="{{b.hasArt}}" hint-placeholder-val="{{true}}">
            <img src="{{b.art}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
            <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(11 12 14 / 0.1) 20%, rgb(11 12 14 / 0.9) 100%)"></span>
          </sc-if>
          <span style="position: relative; display: flex; flex-direction: column; line-height: 1.2"><span style="font-weight: 700; font-size: 15px">{{b.name}}</span><span style="font-size: 12px; color: #d5d7db">{{b.meta}}</span></span>
        </button>
      </sc-for>
    </div>
  </section>

  <section aria-labelledby="mv" style="display: flex; flex-direction: column">
    <h2 id="mv" style="margin: 0 0 8px; font-family: var(--display); font-weight: 800; font-size: 28px">Most valuable</h2>
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="5">
      <button style="display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; min-height: 64px; padding: 6px 0; border: none; border-top: 1px solid var(--line); background: transparent; text-align: left">
        <img src="{{c.art}}" alt="" style="width: 56px; height: 40px; border-radius: 8px; object-fit: cover">
        <span style="display: flex; flex-direction: column; line-height: 1.25; min-width: 0"><span style="font-weight: 700">{{c.name}}</span><span style="font-size: 13px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.where}}</span></span>
        <span style="font-weight: 700; font-variant-numeric: tabular-nums">{{c.price}}</span>
      </button>
    </sc-for>
  </section>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding: 8px 4px 16px; background: var(--ground); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
    <a href="TablePhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-4.5-7-11a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 6.5-7 11-7 11z"></path></svg>Table</a>
    <a href="PlayPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="8" height="12" rx="1.5" transform="rotate(-8 7 12)"></rect><rect x="13" y="6" width="8" height="12" rx="1.5" transform="rotate(8 17 12)"></rect></svg>Play</a>
    <a href="SearchPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="m20 20-4.5-4.5"></path></svg>Cards</a>
    <a href="CollectionPhone.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--text); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="10" height="14" rx="1.5"></rect><path d="M17 7v12M20 9v8"></path></svg>Collection</a>
    <a href="DeckListPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="16" rx="1.5"></rect><path d="M4 7v12a2 2 0 0 0 2 2h10"></path></svg>Decks</a>
    <a href="GroupPhone.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--dim); text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"></circle><path d="M2.5 20a6.5 6.5 0 0 1 13 0"></path><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6.5 6.5 0 0 1 3.5 5.5"></path></svg>Group</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const b = (name, meta, art) => ({ name, meta, art: art || '', hasArt: !!art, border: art ? 'none' : '1px dashed #2a2e33' });
    return {
      boxes: [
        b('Riders of Rohan', '100 cards, $214', '/_blob/c19490e7c081fb35071c85147c01bed4'),
        b('Revival Trance', '100 cards, $171', '/_blob/7678674b257c9f2d67041ed3a4ee2ab4'),
        b('Trade binder', '146 cards, $402', '/_blob/1dccd462a02a0872cc11a4d8518c111f'),
        b('Not filed', '61 cards, $47', '')
      ],
      cards: [
        { name: 'Rhystic Study', where: 'Trade binder', price: '$67.24', art: '/_blob/a3e58275bd2364af6a346bbf2e6a38b9' },
        { name: 'Smothering Tithe', where: 'Trade binder, lightly played', price: '$58.23', art: '/_blob/c4b9626b88aec283a6a20afdb1ec6a2e' },
        { name: 'Anointed Procession', where: 'Riders of Rohan', price: '$54.87', art: '/_blob/39ddc54ea3b9ba45e6d3ac018401863e' },
        { name: 'Cyclonic Rift', where: 'Riders of Rohan', price: '$39.16', art: '/_blob/e9cdfcd4ca473d2d07e135917fc6bcee' },
        { name: 'Boros Charm', where: 'Riders of Rohan', price: 'No price', art: '/_blob/f279aaa76497b626853a97f9a71aab53' }
      ]
    };
  }
}
</script>
</body>
</html>
