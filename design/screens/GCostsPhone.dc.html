<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ward on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--pick:#f0b45a;--bad:#f07a62;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.6)"></div>

  <section role="dialog" aria-label="Ward: discard a card" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; padding: 8px 12px 14px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center">
      <img src="/_blob/94ce56a79c353fb6d35601f9109bccca" alt="" style="width: 52px; height: 40px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.15"><b style="font-size: 17px">Ward: discard a card</b><span style="font-size: 12px; color: var(--dim)">Sam’s Maha, Its Feathers Night. Art: Alessandra Pisano</span></span>
    </div>
    <span style="display: flex; gap: 8px; padding: 8px 10px; border-radius: 12px; background: rgb(240 122 98 / 0.12); color: var(--bad); font-size: 13px; font-weight: 700"><span aria-hidden="true">!</span>If you don’t discard, your Swords to Plowshares is countered.</span>
    <span style="display: flex; justify-content: space-between; font-size: 13px"><b>Your hand</b><span style="color: var(--dim)">{{counter}}</span></span>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px 10px">
      <sc-for list="{{hand}}" as="h" hint-placeholder-count="5">
        <button onClick="{{h.click}}" aria-pressed="{{h.on}}" aria-label="{{h.name}}" style="position: relative; padding: 0; border: none; border-radius: 6px; background: transparent; box-shadow: {{h.ring}}">
          <img src="{{h.img}}" alt="" style="display: block; width: 100%; border-radius: 6px">
        </button>
      </sc-for>
    </div>
    <span style="font-size: 11px; color: var(--dim)">Long-press a card to read it. Card images from Scryfall, © Wizards of the Coast.</span>
    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 8px">
      <button style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Don’t discard</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 16px">{{primary}}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { pick: 'fortress' };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const hand = [['charm', 'Boros Charm', '2d80527eb5c346c24b35ad5381fe99a6'], ['warp', 'Chaos Warp', '0145ecf81c21d180a7799470623719f7'], ['will', 'Akroma’s Will', 'd2df35f8a45cc092aadf237d7374fc27'], ['fierce', 'Fierce Guardianship', 'c858d7cf7a488b3218bd7bbf1fe8b79c'], ['fortress', 'Glacial Fortress', 'e25b0374571373f1ab95c0e88cd1758e']];
    const pick = this.state.pick;
    const name = pick ? hand.find((h) => h[0] === pick)[1] : '';
    return {
      counter: (pick ? 1 : 0) + ' of 1 chosen',
      hand: hand.map(([id, n, img]) => ({ name: n, img: A(img), on: pick === id, ring: pick === id ? '0 0 0 3px #f2efe8' : '0 0 0 2px #f0b45a', click: () => this.setState((s) => ({ pick: s.pick === id ? null : id })) })),
      primary: pick ? 'Discard ' + name : 'Choose a card'
    };
  }
}
</script>
</body>
</html>
