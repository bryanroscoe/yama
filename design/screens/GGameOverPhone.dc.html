<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Game over on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--ground); overflow: hidden">
  <header style="position: relative; height: 270px; flex: none; overflow: hidden">
    <img src="/_blob/c19490e7c081fb35071c85147c01bed4" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%">
    <span aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(180deg, rgb(11 12 14 / 0.3) 0%, rgb(11 12 14 / 0.6) 55%, #0b0c0e 100%)"></span>
    <div style="position: absolute; left: 18px; right: 18px; bottom: 14px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 13px; color: #e6e3dc">Turn 14, 1 h 12 min</span>
      <h1 style="margin: 0; font-family: var(--display); font-weight: 800; font-size: 72px; line-height: 0.9">You won</h1>
      <span style="font-size: 14px">With Éowyn, Shieldmaiden</span>
    </div>
    <span style="position: absolute; right: 10px; top: 10px; font-size: 10px; color: rgb(255 255 255 / 0.8)">Art: Craig Elliott</span>
  </header>

  <div style="padding: 6px 12px 0; display: flex; flex-direction: column; gap: 6px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: grid; grid-template-columns: 22px 40px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 6px 10px 6px 6px; border-radius: 14px; background: {{r.bg}}">
        <b style="font-family: var(--display); font-weight: 800; font-size: 22px; text-align: center">{{r.place}}</b>
        <img src="{{r.art}}" alt="" style="width: 40px; height: 40px; border-radius: 10px; object-fit: cover">
        <span style="display: flex; flex-direction: column; line-height: 1.2; min-width: 0"><b style="font-size: 14px; display: flex; align-items: center; gap: 5px"><span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{r.seat}}"></span>{{r.name}}</b><span style="font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.how}}</span></span>
        <b style="font-family: var(--display); font-weight: 700; font-size: 24px">{{r.life}}</b>
      </div>
    </sc-for>
  </div>

  <span style="margin: 10px 12px 0; padding: 10px 12px; border-radius: 14px; background: var(--surface); font-size: 14px; font-weight: 700">Counts toward group stats</span>

  <div style="margin-top: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px">
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
      <button style="min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Game log</button>
      <button style="min-height: 46px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Back to lobby</button>
    </div>
    <button style="min-height: 56px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 18px">Rematch</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const A = (id) => '/_blob/' + id;
    return {
      rows: [
        { place: 1, name: 'You', how: 'Winner', seat: '#408abf', art: A('c19490e7c081fb35071c85147c01bed4'), life: 17, bg: '#1e2125' },
        { place: 2, name: 'Jules', how: 'Out turn 14, at 0 life', seat: '#757a8a', art: A('383d04a073378ede76b3234038a68757'), life: 0, bg: '#15171a' },
        { place: 3, name: 'Sam', how: 'Out turn 11, at 0 life', seat: '#e8bae4', art: A('7678674b257c9f2d67041ed3a4ee2ab4'), life: 0, bg: '#15171a' },
        { place: 4, name: 'Computer', how: 'Out turn 9, 21 commander damage', seat: '#b55af6', art: A('042e4cb280a5a896fb249a47c8f4a8a3'), life: 26, bg: '#15171a' }
      ]
    };
  }
}
</script>
</body>
</html>
