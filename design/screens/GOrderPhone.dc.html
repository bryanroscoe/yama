<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Put in order on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.65)"></div>

  <section role="dialog" aria-label="{{prompt}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; padding: 8px 12px 14px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; align-items: center">
      <img src="/_blob/2d435a47cd0e74f54b1655dbd317d95d" alt="" style="width: 52px; height: 40px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.15"><b style="font-size: 17px">{{prompt}}</b><span style="font-size: 12px; color: var(--dim)">Brainstorm. Art: Daarken, © Wizards of the Coast</span></span>
    </div>
    <span style="font-size: 12px; color: var(--dim)">{{oracle}}</span>
    <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700"><span aria-hidden="true" style="width: 18px; height: 4px; border-radius: 2px; background: var(--text)"></span>Top of your library</span>
    <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="2">
        <li style="display: grid; grid-template-columns: 26px 70px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px; border-radius: 14px; background: var(--raised)">
          <b style="font-family: var(--display); font-weight: 800; font-size: 24px; text-align: center">{{r.n}}</b>
          <img src="{{r.img}}" alt="{{r.name}}" style="width: 70px; border-radius: 4px">
          <span style="display: flex; flex-direction: column; line-height: 1.2; min-width: 0"><b style="font-size: 14px">{{r.name}}</b><span style="font-size: 12px; color: var(--dim)">{{r.tag}}</span></span>
          <span style="display: flex; flex-direction: column; gap: 4px">
            <button onClick="{{r.up}}" aria-label="Move {{r.name}} up" style="width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: {{r.upInk}}">↑</button>
            <button onClick="{{r.down}}" aria-label="Move {{r.name}} down" style="width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: transparent; color: {{r.downInk}}">↓</button>
          </span>
        </li>
      </sc-for>
    </ol>
    <span style="font-size: 12px; color: var(--dim)">Press and hold a row to drag it. Card images from Scryfall, © Wizards of the Coast.</span>
    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px">
      <button onClick="{{reset}}" style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Reset</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 17px">Done</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { order: ['sunfall', 'fortress'] };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const decision = {
      kind: 'order', destination: 'top',
      prompt: 'Put these on top, in order', oracle: 'Draw three cards, then put two cards from your hand on top of your library in any order.',
      options: [{ id: 'sunfall', name: 'Sunfall', img: A('4f17f1f93dbb25c0d47e2fcb9b2c0ae6') }, { id: 'fortress', name: 'Glacial Fortress', img: A('e25b0374571373f1ab95c0e88cd1758e') }],
      defaultAnswer: ['sunfall', 'fortress']
    };
    const byId = Object.fromEntries(decision.options.map((o) => [o.id, o]));
    const order = this.state.order;
    const swap = (i, k) => this.setState((s) => { const o = s.order.slice(), j = i + k; if (j < 0 || j >= o.length) return null; [o[i], o[j]] = [o[j], o[i]]; return { order: o }; });
    return {
      prompt: decision.prompt, oracle: decision.oracle,
      rows: order.map((id, i) => ({ ...byId[id], n: i + 1, tag: i === 0 ? 'On top: drawn next' : 'Under it',
        upInk: i === 0 ? '#2a2e33' : '#f2efe8', downInk: i === order.length - 1 ? '#2a2e33' : '#f2efe8',
        up: () => swap(i, -1), down: () => swap(i, 1) })),
      reset: () => this.setState({ order: decision.defaultAnswer.slice() })
    };
  }
}
</script>
</body>
</html>
