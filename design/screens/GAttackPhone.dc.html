<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Attacking on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--warn:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--ground); overflow: hidden">
  <div role="status" style="margin: 8px 8px 0; padding: 8px 12px; border-radius: 14px; background: var(--text); color: var(--ground); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px">
    <span>Attack who?</span><span style="padding: 1px 10px; border-radius: 999px; background: var(--ground); color: var(--text); font-size: 12px">{{count}} of 6</span>
  </div>

  <nav aria-label="Aim at" style="display: flex; gap: 6px; padding: 8px 8px 0">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" aria-pressed="{{t.on}}" style="flex: 1; position: relative; height: 72px; padding: 0; border: none; border-radius: 14px; overflow: hidden; background: var(--raised); box-shadow: {{t.ring}}">
        <img src="{{t.art}}" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
        <span aria-hidden="true" style="position: absolute; inset: 0; background: rgb(11 12 14 / {{t.wash}})"></span>
        <span style="position: absolute; inset: 0; padding: 5px 8px; display: flex; flex-direction: column; justify-content: space-between; text-align: left">
          <span style="display: flex; justify-content: space-between; align-items: center"><span style="display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; color: #fff"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.seat}}"></span>{{t.name}}</span><b style="font-family: var(--display); font-size: 24px; line-height: 1; color: #fff">{{t.life}}</b></span>
          <span style="align-self: flex-start; padding: 0 8px; border-radius: 999px; background: {{t.tagBg}}; color: {{t.tagInk}}; font-size: 11px; font-weight: 800">{{t.tag}}</span>
        </span>
      </button>
    </sc-for>
  </nav>
  <p style="margin: 6px 12px 0; font-size: 12px; color: var(--dim)">{{blockers}}</p>

  <section aria-label="Your creatures" style="flex: 1; min-height: 0; margin: 10px 8px 0; padding: 12px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: var(--dim)">Tap a creature to send it at {{aimName}}. Tap again to keep it home.</span>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 10px; padding-top: 10px">
      <sc-for list="{{mine}}" as="c" hint-placeholder-count="5">
        <button onClick="{{c.click}}" aria-pressed="{{c.on}}" aria-label="{{c.label}}" style="position: relative; height: 104px; padding: 0; border: none; border-radius: 14px; background: var(--raised); transform: translateY({{c.lift}}px); box-shadow: {{c.ring}}; transition: transform 160ms, box-shadow 160ms">
          <span style="position: absolute; inset: 0; border-radius: inherit; overflow: hidden">
            <sc-if value="{{c.hasArt}}" hint-placeholder-val="{{true}}"><img src="{{c.art}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
            <span style="position: absolute; left: 0; right: 0; top: 0; padding: 1px 6px; background: rgb(11 12 14 / 0.82); font-size: 12px; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
            <sc-if value="{{c.many}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 4px; bottom: 4px; padding: 0 4px; border-radius: 4px; background: rgb(11 12 14 / 0.85); font-size: 12px; font-weight: 700">{{c.count}}</span></sc-if>
            <span style="position: absolute; right: 4px; bottom: 4px; padding: 0 5px; border-radius: 4px; background: var(--text); color: var(--ground); font-size: 13px; font-weight: 700">{{c.pt}}</span>
          </span>
          <sc-if value="{{c.on}}" hint-placeholder-val="{{false}}"><img src="{{c.chip}}" alt="" style="position: absolute; left: -7px; top: -9px; width: 28px; height: 28px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px #408abf, 0 0 0 5px var(--surface)"></sc-if>
        </button>
      </sc-for>
    </div>
    <button onClick="{{all}}" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; font-size: 14px">Everything at {{aimName}}</button>
    <span style="margin-top: auto; font-size: 10px; color: var(--dim)">Art: Craig Elliott, Bryan Sola, Yongjae Choi, Anna Podedworna, Marta Nael, Nils Hamm, Darren Tan, Gintas Galvanauskas. © Wizards of the Coast</span>
  </section>

  <div style="margin-top: 8px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 0 4px">
      <sc-for list="{{plan}}" as="g" hint-placeholder-count="1">
        <span style="display: flex; justify-content: space-between; gap: 10px; font-size: 14px"><span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="width: 8px; height: 8px; border-radius: 50%; background: {{g.seat}}; flex: none"></span><span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{g.who}}</span></span><b>{{g.dmg}}</b></span>
      </sc-for>
      <span style="font-size: 12px; color: {{noteInk}}">{{note}}</span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px">
      <button onClick="{{clear}}" style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Clear</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 17px">{{doneLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { aim: 'sam', atk: { eowyn: 'sam', adeline: 'sam' } };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const seats = {
      computer: { name: 'Computer', seat: '#b55af6', art: A('042e4cb280a5a896fb249a47c8f4a8a3'), life: 31, blockers: 'Computer can block with Spirit ×2.' },
      sam: { name: 'Sam', seat: '#e8bae4', art: A('7678674b257c9f2d67041ed3a4ee2ab4'), life: 24, blockers: 'Sam can block with Terra, Grave Titan and Zombie ×2.' },
      jules: { name: 'Jules', seat: '#757a8a', art: A('383d04a073378ede76b3234038a68757'), life: 36, blockers: 'Jules can block with Mister Fantastic.' }
    };
    const order = ['computer', 'sam', 'jules'];
    const defs = [
      { id: 'eowyn', name: 'Éowyn', art: 'c19490e7c081fb35071c85147c01bed4', p: 5, t: 4 },
      { id: 'adeline', name: 'Adeline', art: '93443cca264c2d66fac605d8e8311296', p: 6, t: 4 },
      { id: 'aragorn', name: 'Aragorn', art: 'c2a67f4f687b666fcd3c4d8cb3b0bf63', p: 4, t: 4 },
      { id: 'faramir', name: 'Faramir', art: '62e4a477ddbf5628d609a86bc8d12c3a', p: 2, t: 2 },
      { id: 'soldier', name: 'Soldier', art: '', p: 1, t: 1, n: 2 }
    ];
    const { aim, atk } = this.state;
    const count = defs.reduce((n, c) => n + (atk[c.id] ? (c.n || 1) : 0), 0);
    const plan = order.map((k) => {
      const list = defs.filter((c) => atk[c.id] === k);
      if (!list.length) return null;
      const dmg = list.reduce((n, c) => n + c.p * (c.n || 1), 0);
      return { seat: seats[k].seat, who: seats[k].name + ': ' + list.map((c) => c.name + (c.n ? ' ×2' : '')).join(', '), dmg, k };
    }).filter(Boolean);
    const lethal = plan.find((g) => g.dmg >= seats[g.k].life);
    return {
      count,
      tabs: order.map((k) => {
        const n = defs.reduce((m, c) => m + (atk[c.id] === k ? (c.n || 1) : 0), 0);
        const on = aim === k;
        return { name: seats[k].name, life: seats[k].life, seat: seats[k].seat, art: seats[k].art, on,
          wash: on ? 0.3 : 0.6, ring: on ? '0 0 0 3px #f2efe8' : 'none',
          tag: n ? n + ' attacking' : on ? 'Aimed' : 'Tap to aim', tagBg: n ? '#408abf' : on ? '#f2efe8' : 'rgb(11 12 14 / 0.7)', tagInk: n || on ? '#0b0c0e' : '#d5d7db',
          pick: () => this.setState({ aim: k }) };
      }),
      blockers: seats[aim].blockers,
      aimName: seats[aim].name,
      mine: defs.map((c) => {
        const d = atk[c.id];
        return { name: c.name, art: c.art ? A(c.art) : '', hasArt: !!c.art, pt: c.p + '/' + c.t, count: c.n ? '×' + c.n : '', many: !!c.n,
          on: !!d, chip: d ? seats[d].art : '', lift: d ? -10 : 0,
          ring: d ? '0 0 0 3px #408abf, 0 12px 24px rgb(0 0 0 / 0.6)' : '0 0 0 1px #2a2e33',
          label: c.name + (d ? ', attacking ' + seats[d].name : ', not attacking'),
          click: () => this.setState((s) => { const a = { ...s.atk }; if (a[c.id] === s.aim) delete a[c.id]; else a[c.id] = s.aim; return { atk: a }; }) };
      }),
      all: () => this.setState((s) => ({ atk: Object.fromEntries(defs.map((c) => [c.id, s.aim])) })),
      plan,
      note: lethal ? 'Lethal on ' + seats[lethal.k].name + ' if nothing is blocked.' : count ? 'Damage if nothing is blocked. Attack triggers aren’t counted.' : 'No one is attacking yet.',
      noteInk: lethal ? '#8fd3a8' : '#a9adb3',
      doneLabel: count ? 'Attack (' + count + ')' : 'No attacks',
      clear: () => this.setState({ atk: {} })
    };
  }
}
</script>
</body>
</html>
