<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blocking on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--good:#8fd3a8;--warn:#f0b45a;--bad:#f07a62;--sam:#f08a70;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: var(--ground); overflow: hidden">
  <div role="status" style="margin: 8px 8px 0; padding: 8px 12px; border-radius: 14px; background: var(--text); color: var(--ground); display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 15px">
    <span>{{prompt}}</span><span style="padding: 1px 10px; border-radius: 999px; background: var(--ground); color: var(--text); font-size: 12px">{{nBlocks}} blocking</span>
  </div>

  <section aria-label="Attacking you" style="margin: 8px 8px 0; padding: 10px; border-radius: 16px; background: rgb(240 138 112 / 0.1); box-shadow: inset 0 0 0 1px rgb(240 138 112 / 0.45); display: flex; flex-direction: column; gap: 8px">
    <span style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--sam)"><img src="/_blob/7678674b257c9f2d67041ed3a4ee2ab4" alt="" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover">Sam attacks you</span>
    <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px">
      <sc-for list="{{attackers}}" as="a" hint-placeholder-count="4">
        <button onClick="{{a.click}}" aria-label="{{a.label}}" style="display: flex; flex-direction: column; gap: 4px; padding: 0; border: none; background: transparent; text-align: left">
          <span style="position: relative; width: 100%; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--raised); box-shadow: {{a.ring}}">
            <sc-if value="{{a.hasArt}}" hint-placeholder-val="{{true}}"><img src="{{a.art}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
            <span style="position: absolute; left: 0; right: 0; top: 0; padding: 1px 5px; background: rgb(11 12 14 / 0.82); font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{a.name}}</span>
            <span style="position: absolute; right: 3px; bottom: 3px; padding: 0 4px; border-radius: 4px; background: var(--text); color: var(--ground); font-size: 12px; font-weight: 700">{{a.pt}}</span>
          </span>
          <span style="font-size: 11px; color: {{a.noteInk}}; font-weight: 700; line-height: 1.2; min-height: 26px">{{a.note}}</span>
          <span style="display: flex; gap: 2px; min-height: 22px">
            <sc-for list="{{a.blockers}}" as="b" hint-placeholder-count="1"><span style="width: 22px; height: 22px; border-radius: 50%; overflow: hidden; background: var(--raised); box-shadow: 0 0 0 2px #6cb0f5; display: grid; place-items: center; font-size: 10px; font-weight: 800"><sc-if value="{{b.hasArt}}" hint-placeholder-val="{{true}}"><img src="{{b.art}}" alt="{{b.name}}" style="width: 100%; height: 100%; object-fit: cover"></sc-if><sc-if value="{{b.noArt}}" hint-placeholder-val="{{false}}">{{b.initial}}</sc-if></span></sc-for>
          </span>
        </button>
      </sc-for>
    </div>
  </section>

  <section aria-label="Your creatures" style="flex: 1; min-height: 0; margin: 8px 8px 0; padding: 10px; border-radius: 16px; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 13px; color: var(--dim)">Tap a creature, then the attacker above it should block. Tap a blocker again to undo.</span>
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px 10px; padding-top: 8px">
      <sc-for list="{{mine}}" as="c" hint-placeholder-count="6">
        <button onClick="{{c.click}}" aria-pressed="{{c.on}}" aria-label="{{c.label}}" style="position: relative; height: 96px; padding: 0; border: none; border-radius: 14px; background: var(--raised); box-shadow: {{c.ring}}">
          <span style="position: absolute; inset: 0; border-radius: inherit; overflow: hidden">
            <sc-if value="{{c.hasArt}}" hint-placeholder-val="{{true}}"><img src="{{c.art}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if>
            <span style="position: absolute; left: 0; right: 0; top: 0; padding: 1px 6px; background: rgb(11 12 14 / 0.82); font-size: 12px; font-weight: 700; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.name}}</span>
            <span style="position: absolute; right: 4px; bottom: 4px; padding: 0 5px; border-radius: 4px; background: var(--text); color: var(--ground); font-size: 13px; font-weight: 700">{{c.pt}}</span>
          </span>
          <sc-if value="{{c.hasFate}}" hint-placeholder-val="{{false}}"><span style="position: absolute; left: 50%; bottom: -11px; transform: translateX(-50%); padding: 0 8px; border-radius: 999px; background: {{c.fateBg}}; color: var(--ground); font-size: 11px; font-weight: 800; white-space: nowrap; box-shadow: 0 0 0 3px var(--surface)">{{c.fate}}</span></sc-if>
        </button>
      </sc-for>
    </div>
  </section>

  <div style="margin-top: 8px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 12px 10px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 0 4px; font-size: 12px; color: var(--dim); line-height: 1.25">
      <span>Reaches you<br><b style="font-family: var(--display); font-size: 26px; color: var(--text)">{{through}}</b></span>
      <span>Life after<br><b style="font-family: var(--display); font-size: 26px; color: var(--text)">{{lifeAfter}}</b></span>
      <span>From Terra<br><b style="font-family: var(--display); font-size: 26px; color: {{cmdInk}}">{{cmd}}/21</b></span>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 8px">
      <button onClick="{{reset}}" style="min-height: 52px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Reset</button>
      <button style="min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 17px">{{doneLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'faramir', blocks: { aragorn: 'terra' } };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const { sel, blocks } = this.state;
    const attackers = [
      { id: 'titan', name: 'Grave Titan', art: '1dccd462a02a0872cc11a4d8518c111f', p: 6, t: 6, dt: true },
      { id: 'terra', name: 'Terra', art: '7678674b257c9f2d67041ed3a4ee2ab4', p: 3, t: 3 },
      { id: 'z1', name: 'Zombie', art: '', p: 2, t: 2 },
      { id: 'z2', name: 'Zombie', art: '', p: 2, t: 2 }
    ];
    const mine = [
      { id: 'eowyn', name: 'Éowyn', art: 'c19490e7c081fb35071c85147c01bed4', p: 5, t: 4 },
      { id: 'adeline', name: 'Adeline', art: '93443cca264c2d66fac605d8e8311296', p: 6, t: 4 },
      { id: 'aragorn', name: 'Aragorn', art: 'c2a67f4f687b666fcd3c4d8cb3b0bf63', p: 4, t: 4 },
      { id: 'faramir', name: 'Faramir', art: '62e4a477ddbf5628d609a86bc8d12c3a', p: 2, t: 2 },
      { id: 's1', name: 'Soldier', art: '', p: 1, t: 1 },
      { id: 's2', name: 'Soldier', art: '', p: 1, t: 1 }
    ];
    const blockersOf = (aid) => mine.filter((m) => blocks[m.id] === aid);
    const killed = (a) => blockersOf(a.id).reduce((n, m) => n + m.p, 0) >= a.t;
    const unblocked = attackers.filter((a) => !blockersOf(a.id).length);
    const through = unblocked.reduce((n, a) => n + a.p, 0);
    const terraThrough = unblocked.some((a) => a.id === 'terra');
    const selM = mine.find((m) => m.id === sel);
    return {
      prompt: selM ? 'Tap what ' + selM.name + ' blocks' : 'Choose blockers',
      nBlocks: Object.keys(blocks).length,
      attackers: attackers.map((a) => {
        const bl = blockersOf(a.id);
        return { name: a.name, art: a.art ? A(a.art) : '', hasArt: !!a.art, pt: a.p + '/' + a.t,
          ring: sel ? '0 0 0 3px #f0b45a' : '0 0 0 2px #f08a70',
          note: bl.length ? (killed(a) ? 'Dies' : 'Blocked') : a.dt ? 'Deathtouch' : a.p + ' to you',
          noteInk: bl.length ? (killed(a) ? '#8fd3a8' : '#f2efe8') : a.dt ? '#f07a62' : '#f08a70',
          blockers: bl.map((m) => ({ name: m.name, art: m.art ? A(m.art) : '', hasArt: !!m.art, noArt: !m.art, initial: m.name[0] })),
          label: a.name + (bl.length ? ', blocked' : ', unblocked'),
          click: sel ? () => this.setState((s) => ({ sel: null, blocks: { ...s.blocks, [s.sel]: a.id } })) : null };
      }),
      mine: mine.map((m) => {
        const a = attackers.find((x) => x.id === blocks[m.id]);
        const isSel = sel === m.id;
        const dies = a && (a.dt || a.p >= m.t);
        return { name: m.name, art: m.art ? A(m.art) : '', hasArt: !!m.art, pt: m.p + '/' + m.t, on: isSel || !!a,
          ring: isSel ? '0 0 0 3px #f2efe8, 0 0 0 8px rgb(242 239 232 / 0.2)' : a ? '0 0 0 3px #6cb0f5' : '0 0 0 1px #2a2e33',
          hasFate: !!a, fate: a ? (dies ? 'Dies' : 'Survives') + ' vs ' + a.name.split(' ')[0] : '', fateBg: dies ? '#f07a62' : '#8fd3a8',
          label: m.name + (a ? ', blocking ' + a.name : isSel ? ', picked' : ''),
          click: () => this.setState((s) => {
            if (s.blocks[m.id]) { const b = { ...s.blocks }; delete b[m.id]; return { blocks: b, sel: null }; }
            return { sel: s.sel === m.id ? null : m.id };
          }) };
      }),
      through, lifeAfter: 38 - through,
      cmd: 3 + (terraThrough ? 3 : 0), cmdInk: terraThrough ? '#f0b45a' : '#f2efe8',
      doneLabel: Object.keys(blocks).length ? 'Block (' + Object.keys(blocks).length + ')' : 'No blocks',
      reset: () => this.setState({ sel: null, blocks: {} })
    };
  }
}
</script>
</body>
</html>
