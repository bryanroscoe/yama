<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose a number on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--pick:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.65)"></div>

  <section role="dialog" aria-label="{{prompt}}" style="position: absolute; left: 0; right: 0; bottom: 0; top: 150px; padding: 8px 12px 14px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 12px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center">
      <img src="{{srcArt}}" alt="" style="width: 56px; height: 42px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.15"><b style="font-size: 16px">{{prompt}}</b><span style="font-size: 11px; color: var(--dim)">{{srcName}}. Art: {{artist}}, © Wizards of the Coast</span></span>
    </div>
    <span style="font-size: 12px; color: var(--dim)">{{oracle}}</span>
    <div style="display: flex; align-items: center; justify-content: center; gap: 12px; padding: 10px; border-radius: 16px; background: var(--raised)">
      <button onClick="{{down}}" aria-label="One less" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--ground); font-size: 24px; color: {{downInk}}">−</button>
      <output aria-live="polite" style="width: 96px; text-align: center; font-family: var(--display); font-weight: 800; font-size: 64px; line-height: 1">{{value}}</output>
      <button onClick="{{up}}" aria-label="One more" style="width: 52px; height: 52px; border-radius: 50%; border: none; background: var(--ground); font-size: 24px; color: {{upInk}}">+</button>
    </div>
    <div role="radiogroup" aria-label="Numbers" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px">
      <sc-for list="{{keys}}" as="k" hint-placeholder-count="10"><button role="radio" aria-checked="{{k.on}}" onClick="{{k.pick}}" style="min-height: 52px; border-radius: 14px; border: none; background: {{k.bg}}; color: {{k.ink}}; box-shadow: {{k.ring}}; font-family: var(--display); font-weight: 800; font-size: 24px">{{k.n}}</button></sc-for>
    </div>
    <div style="margin-top: auto; display: grid; grid-template-columns: 1fr; gap: 8px">
      <button style="min-height: 54px; border-radius: 999px; border: none; background: {{primaryBg}}; color: {{primaryInk}}; font-weight: 800; font-size: 17px">{{primary}}</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The engine's pending decision, as the builder's payload describes it
  pending() {
    const A = (id) => '/_blob/' + id;
    return {
      kind: 'number',
      source: { name: 'Talion, the Kindly Lord', art: A('db5813446e0e64d6bed1b10f055b0265'), artist: 'Justyna Dura', image: A('26786bca4dcd222cfe23986dd4c42e31') },
      prompt: 'Choose a number between 1 and 10',
      oracle: 'Flying. As Talion enters, choose a number between 1 and 10. Whenever an opponent casts a spell with mana value, power, or toughness equal to the chosen number, that player loses 2 life and you draw a card.',
      options: [], min: 1, max: 10, defaultAnswer: null
    };
  }
  constructor(props) {
    super(props);
    this.state = { v: 3 };
  }
  renderVals() {
    const d = this.pending();
    const v = this.state.v;
    const clamp = (n) => Math.max(d.min, Math.min(d.max, n));
    const keys = [];
    for (let n = d.min; n <= d.max; n++) keys.push(n);
    return {
      srcArt: d.source.art, srcName: d.source.name, artist: d.source.artist, prompt: d.prompt, oracle: d.oracle,
      value: v === null ? '–' : v,
      downInk: v !== null && v > d.min ? '#f2efe8' : '#2a2e33', upInk: v === null || v < d.max ? '#f2efe8' : '#2a2e33',
      down: () => this.setState((s) => ({ v: s.v === null ? d.min : clamp(s.v - 1) })),
      up: () => this.setState((s) => ({ v: s.v === null ? d.min : clamp(s.v + 1) })),
      keys: keys.map((n) => ({ n, on: v === n, bg: v === n ? '#f2efe8' : 'transparent', ink: v === n ? '#0b0c0e' : '#f2efe8', ring: v === n ? 'none' : 'inset 0 0 0 2px #f0b45a', pick: () => this.setState({ v: n }) })),
      primary: v === null ? 'Choose a number' : 'Choose ' + v,
      primaryBg: v === null ? '#1e2125' : '#f2efe8', primaryInk: v === null ? '#a9adb3' : '#0b0c0e'
    };
  }
}
</script>
</body>
</html>
