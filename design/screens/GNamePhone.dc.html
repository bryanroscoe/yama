<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Name a card on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--pick:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.65)"></div>

  <section role="dialog" aria-label="{{prompt}}" style="position: absolute; left: 0; right: 0; top: 40px; height: 504px; padding: 8px 12px 12px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <div style="display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 10px; align-items: center">
      <img src="{{srcArt}}" alt="" style="width: 56px; height: 42px; border-radius: 8px; object-fit: cover">
      <span style="display: flex; flex-direction: column; line-height: 1.15"><b style="font-size: 17px">{{prompt}}</b><span style="font-size: 11px; color: var(--dim)">{{srcName}}. Art: {{artist}}, © Wizards of the Coast</span></span>
    </div>
    <span style="font-size: 12px; color: var(--dim)">{{oracle}}</span>
    <span style="display: flex; align-items: center; min-height: 48px; padding: 0 14px; border-radius: 12px; background: var(--ground); box-shadow: inset 0 0 0 2px var(--text); font-size: 17px; font-weight: 700">{{typed}}<span aria-hidden="true" style="width: 2px; height: 20px; margin-left: 1px; background: var(--text)"></span></span>
    <div role="listbox" aria-label="Matches" style="display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{matches}}" as="m" hint-placeholder-count="3">
        <button role="option" aria-selected="{{m.on}}" onClick="{{m.pick}}" style="display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 52px; padding: 4px 10px 4px 4px; border-radius: 12px; border: none; background: var(--raised); box-shadow: {{m.ring}}; text-align: left">
          <span style="width: 44px; height: 44px; border-radius: 8px; overflow: hidden; background: var(--ground)"><sc-if value="{{m.hasArt}}" hint-placeholder-val="{{false}}"><img src="{{m.art}}" alt="" style="width: 100%; height: 100%; object-fit: cover"></sc-if></span>
          <span style="display: flex; flex-direction: column; line-height: 1.2; min-width: 0"><b style="font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{m.name}}</b><span style="font-size: 11px; color: var(--dim)">{{m.where}}</span></span>
        </button>
      </sc-for>
    </div>
    <span style="font-size: 10px; color: var(--dim)">Names from Yama’s card list; cards in play first. Quintorius art: Darren Tan, © Wizards of the Coast</span>
    <div style="margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 8px">
      <button style="min-height: 48px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700">Cancel</button>
      <button style="min-height: 50px; border-radius: 999px; border: none; background: {{primaryBg}}; color: {{primaryInk}}; font-weight: 800; font-size: 15px">{{primary}}</button>
    </div>
  </section>
  <div aria-label="Phone keyboard" style="position: absolute; left: 0; right: 0; bottom: 0; height: 300px; background: #2b2d31; display: grid; place-items: center; color: #8b8f96; font-size: 14px">The phone’s own keyboard. The dock sits right above it.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // The engine's pending decision, as the builder's payload describes it. NamedChoice { choice_type, options, free_entry }
  pending() {
    const A = (id) => '/_blob/' + id;
    return {
      kind: 'text', choiceType: 'card name',
      source: { name: 'Pithing Needle', art: A('639302e45711592fbaa493f62ba9cbc1'), artist: 'Anthony Palumbo', image: A('24d589e696c44e84121b6d42cb03b394') },
      prompt: 'Choose a card name',
      oracle: 'As this artifact enters, choose a card name. Activated abilities of sources with the chosen name can’t be activated unless they’re mana abilities.',
      typed: 'Quin',
      options: [
        { id: 'qhc', name: 'Quintorius, History Chaser', zone: 'battlefield', controller: 'Computer', art: A('042e4cb280a5a896fb249a47c8f4a8a3') },
        { id: 'qk', name: 'Quintorius Kand', zone: 'card list' },
        { id: 'qfh', name: 'Quintorius, Field Historian', zone: 'card list' }
      ],
      freeEntry: true, min: 1, max: 1, defaultAnswer: null
    };
  }
  constructor(props) {
    super(props);
    this.state = { picked: 'qhc' };
  }
  renderVals() {
    const d = this.pending();
    const chosen = d.options.find((o) => o.id === this.state.picked);
    return {
      srcArt: d.source.art, srcName: d.source.name, artist: d.source.artist, prompt: d.prompt, oracle: d.oracle, typed: d.typed,
      matches: d.options.map((o) => {
        const on = chosen && o.id === chosen.id;
        return { name: o.name, hasArt: !!o.art, art: o.art || '', where: o.zone === 'battlefield' ? 'On the battlefield, ' + o.controller : 'Card',
          on, ring: on ? '0 0 0 3px #f2efe8' : '0 0 0 1px #f0b45a', pick: () => this.setState({ picked: o.id }) };
      }),
      primary: chosen ? 'Name ' + chosen.name : 'Choose a card name',
      primaryBg: chosen ? '#f2efe8' : '#1e2125', primaryInk: chosen ? '#0b0c0e' : '#a9adb3'
    };
  }
}
</script>
</body>
</html>
