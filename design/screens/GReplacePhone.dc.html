<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Replacement effects on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&amp;family=Big+Shoulders:opsz,wght@10..72,500;10..72,700;10..72,800&amp;display=swap" rel="stylesheet">
<style>
:root{--ground:#0b0c0e;--surface:#15171a;--raised:#1e2125;--line:#2a2e33;--text:#f2efe8;--dim:#a9adb3;--pick:#f0b45a;--display:"Big Shoulders","Arial Narrow",sans-serif;--body:"Atkinson Hyperlegible Next",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0c0e;color:#f2efe8;font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--ground)">
  <dc-import name="BoardBasePhone" hint-size="390px,844px"></dc-import>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgb(0 0 0 / 0.6)"></div>

  <section role="dialog" aria-label="Which applies first?" style="position: absolute; left: 0; right: 0; bottom: 0; top: 130px; padding: 8px 12px 14px; border-radius: 24px 24px 0 0; background: var(--surface); display: flex; flex-direction: column; gap: 10px">
    <span aria-hidden="true" style="align-self: center; width: 40px; height: 5px; border-radius: 999px; background: var(--line)"></span>
    <span style="font-size: 12px; color: var(--dim)">One +1/+1 counter would be put on Adeline.</span>
    <b style="font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1">Which applies first?</b>
    <span style="font-size: 13px; color: var(--dim)">Both apply, one after the other. The order can change the result.</span>
    <sc-for list="{{candidates}}" as="c" hint-placeholder-count="2">
      <button role="radio" aria-checked="{{c.on}}" onClick="{{c.pick}}" style="display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 10px; align-items: start; padding: 10px; border-radius: 14px; border: none; background: {{c.bg}}; box-shadow: {{c.ring}}; text-align: left">
        <img src="{{c.img}}" alt="" style="width: 64px; border-radius: 4px">
        <span style="display: flex; flex-direction: column; gap: 3px; line-height: 1.3"><span style="display: flex; justify-content: space-between; gap: 6px"><b style="font-size: 14px">{{c.name}}</b><span style="font-size: 11px; font-weight: 800; color: {{c.tagInk}}">{{c.tag}}</span></span><span style="font-size: 12px; color: var(--dim)">{{c.text}}</span></span>
      </button>
    </sc-for>
    <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 13px"><button role="checkbox" aria-checked="{{remember}}" onClick="{{toggle}}" style="width: 26px; height: 26px; flex: none; border-radius: 6px; border: 2px solid var(--text); background: {{rememberBg}}; color: var(--ground); font-weight: 800; padding: 0">{{rememberMark}}</button>Use this order every time</label>
    <span style="font-size: 11px; color: var(--dim)">Art: Mark Winters, Chuck Lukacs. Card images from Scryfall, © Wizards of the Coast.</span>
    <button style="margin-top: auto; min-height: 54px; border-radius: 999px; border: none; background: var(--text); color: var(--ground); font-weight: 800; font-size: 17px">{{primary}}</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { first: 'season', remember: true };
  }
  renderVals() {
    const A = (id) => '/_blob/' + id;
    const candidates = [
      { id: 'scales', name: 'Hardened Scales', img: A('8f8d0ea5fda95ff96c4a37ace325e14f'), text: 'If one or more +1/+1 counters would be put on a creature you control, that many plus one +1/+1 counters are put on it instead.' },
      { id: 'season', name: 'Doubling Season', img: A('c0f1da1fcdafe8b7f2b4fcf6ba0f938e'), text: 'If an effect would put one or more counters on a permanent you control, it puts twice that many of those counters on that permanent instead.' }
    ];
    const { first, remember } = this.state;
    return {
      candidates: candidates.map((c) => { const on = c.id === first; return { ...c, on, bg: on ? '#1e2125' : 'transparent', ring: on ? '0 0 0 3px #f2efe8' : '0 0 0 2px #f0b45a', tag: on ? 'First' : 'Then', tagInk: on ? '#f2efe8' : '#a9adb3', pick: () => this.setState({ first: c.id }) }; }),
      remember, rememberBg: remember ? '#f2efe8' : 'transparent', rememberMark: remember ? '✓' : '',
      toggle: () => this.setState((s) => ({ remember: !s.remember })),
      primary: candidates.find((c) => c.id === first).name + ' first'
    };
  }
}
</script>
</body>
</html>
