<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font-body)}
.row{display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.seg{display:inline-flex;padding:3px;gap:2px;background:var(--surface);border-radius:999px}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;color:var(--dim);border-radius:999px;min-height:44px;padding:8px 16px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--ground)}
</style>
</head>
<body>
<div class="row">
<div class="seg" role="group" aria-label="Decks sections"><button type="button" aria-pressed="false">Decks</button><button type="button" aria-pressed="false">Sharing</button><button type="button" aria-pressed="false">Swap cards</button><button type="button" aria-pressed="true">Plans</button></div>
<div class="seg" role="group" aria-label="Bracket"><button type="button" aria-pressed="true">Bracket 4</button><button type="button" aria-pressed="false">3</button><button type="button" aria-pressed="false">2</button></div>
</div>
</body>
</html>
