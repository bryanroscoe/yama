[package]
name = "yama-server"
version = "0.1.0"
edition = "2024"

[dependencies]
yama-play = { path = "../play" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# JSON paths in plan import errors (already in the tree through axum).
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
# sqlx takes its slow-statement log level as a `log` level (db.rs; already in the tree through sqlx).
log = "0.4"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
argon2 = "0.6.0"
# Encrypts users' own Anthropic API keys for the advisor (advisor/keys.rs).
chacha20poly1305 = "0.10"
# OAuth for Claude's connectors (oauth/): PKCE and HTTP Basic client secrets, redirect URIs and
# form bodies. Both were already in the tree (jsonwebtoken, reqwest).
base64 = "0.22"
url = "2.5"
# Middleware composition for the web app's files and the API's CORS (routes.rs; already in the
# tree through axum).
tower = { version = "0.5.3", features = ["util"] }
# The allocator the lab's batch runner uses (already in the tree through phase-ai); see main.rs.
mimalloc = "0.1"
libc = "0.2"
tempfile = "3.27.0"
unicode-normalization = "0.1.26"
fancy-regex = "0.20.0"
# The scanner's art supplement (scan_art.rs): runs the embedding half of the pinned ManaVault
# embed.onnx on Scryfall art crops of illustrations the bundle doesn't know. Pure Rust, so the
# image needs no ONNX runtime or Node. Pinned exactly: a model runtime's numerics are part of
# the embeddings' meaning.
tract-onnx = "=0.23.9"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
half = "2.7"
# The printing look's vectors (scan_look.rs) decode Scryfall's older JPEG pictures with
# libjpeg-turbo's own code (MozJPEG's decoder, built from its vendored C sources by the cc crate;
# IJG, BSD-3-Clause and Zlib licences), so the pixels are the ones the phone's browser decodes
# (Chrome uses libjpeg-turbo): the image crate's JPEG decoder differs on about 8% of values. Its
# WebP decoder already gives libwebp's pixels. No SIMD, so no nasm is needed.
mozjpeg = { version = "0.10.13", default-features = false }
# Retry-After as an HTTP date (scan_art.rs); already in the tree through hyper.
httpdate = "1.0.3"
