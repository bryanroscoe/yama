[package]
name = "yama-server"
version = "0.1.0"
edition = "2024"

[dependencies]
yama-play = { path = "../play" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.4.0"
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
# JSON paths in plan import errors (already in the tree through axum).
serde_path_to_error = "0.1.20"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "json", "chrono", "uuid"] }
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.53.3", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "fs", "trace", "compression-gzip"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
argon2 = "0.6.0"
# Encrypts users' own Anthropic API keys for the advisor (advisor/keys.rs).
chacha20poly1305 = "0.10"

[dev-dependencies]
tempfile = "3.27.0"
# Router tests: `ServiceExt::oneshot` sends one request through the whole app.
tower = { version = "0.5.3", features = ["util"] }
