services:
  runner:
    image: yama-deploy-runner:2.338.2
    container_name: yama-deploy-runner
    restart: unless-stopped
    user: "1001:1001"
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    pids_limit: 256
    volumes:
      - ./state:/runner-state
      - ./ssh:/run/yama-deploy:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
