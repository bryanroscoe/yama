# Yama on saget (Unraid). Lives at /mnt/user/appdata/yama with this file, a server-local
# yama.env (not in git) and data/. See deploy/README.md.
services:
  yama:
    image: ${YAMA_IMAGE:-yama:latest}
    container_name: yama
    restart: unless-stopped
    user: "99:100"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: yama.env
    environment:
      # Yama's public address, for OAuth sign-in from Claude Code and claude.ai's connectors
      # (server/src/oauth): the issuer, endpoints and /mcp resource are built from it.
      YAMA_PUBLIC_URL: https://yama.ing
      # The Mythic Tools import (server/src/bridges/mythic), on for everyone (Bryan, 2026-10-31:
      # "productionize it on the site so people who use this site can import data from there").
      YAMA_MYTHIC_BRIDGE: "1"
      # The Android app (web/android) runs at https://localhost and calls the API with a bearer
      # token, never cookies (docs/mobile.md).
      YAMA_CORS_ORIGINS: https://localhost
      # The server's log, with a line for every write request and command, in daily files on the
      # data volume (data/logs/yama.YYYY-MM-DD.log), kept 180 days (YAMA_LOG_DAYS). `docker logs`
      # starts over at every deploy (server/src/request_log.rs).
      YAMA_LOG_DIR: /data/logs
    volumes:
      - ./data:/data
    ports:
      # LAN access; the public route goes through the existing Cloudflare tunnel. Set
      # YAMA_LAN_ADDRESS to saget's LAN address in the server-local .env beside this file to
      # publish on that interface only (deploy/README.md); unset, it listens on all IPv4.
      - "${YAMA_LAN_ADDRESS:-0.0.0.0}:8099:8787"
    networks: [tunnel, advisor, forge]
    # The rules engine (about 0.7 GB) plus the lab's game threads and live games. At 3 GB the lab
    # filled it on 2026-10-23 and every game slowed to a crawl while the kernel reclaimed pages.
    mem_limit: 5g
  # "Ask Claude" (deploy/Dockerfile.advisor). No published port: only yama reaches it, on the
  # private advisor network. advisor.env (server-local, mode 0600) holds ADVISOR_SECRET, which
  # deploy.sh makes, Bryan's CLAUDE_CODE_OAUTH_TOKEN, which deploy/advisor-token.sh writes, and
  # optionally ANTHROPIC_SHARED_API_KEY (the pay-per-use key for granted friends), which
  # deploy/advisor-shared-key.sh writes. Without it, shared mode is simply off.
  yama-advisor:
    image: ${YAMA_ADVISOR_IMAGE:-yama-advisor:latest}
    container_name: yama-advisor
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: advisor.env
    networks: [advisor]
    mem_limit: 2g
    pids_limit: 256
  # Forge as a second Lab engine (deploy/Dockerfile.forge-worker, server/src/lab/forge.rs). No published
  # port and no internet: only yama reaches it, on the internal forge network. forge.env (server-local,
  # mode 0600) holds FORGE_SECRET, which deploy.sh makes. Each game is a JVM of up to FORGE_XMX: memory is
  # slots x (heap + 512 MB) + 1 GB, and two CPUs a game, at a low share so Plex and the rest win.
  yama-forge:
    image: ${YAMA_FORGE_IMAGE:-yama-forge:latest}
    container_name: yama-forge
    restart: unless-stopped
    user: "99:100"
    read_only: true
    tmpfs:
      - /work:size=2g,uid=99,gid=100,mode=0700
      - /tmp:size=1g,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: forge.env
    environment:
      FORGE_SLOTS: "3"
      FORGE_XMX: 1536m
      FORGE_JVM_CPUS: "2"
    networks: [forge]
    cpus: 6
    cpu_shares: 256
    mem_limit: 7g
    pids_limit: 2048
networks:
  tunnel:
    external: true
    name: novalyst_default
  # yama and yama-advisor only. A plain bridge, because the advisor reaches api.anthropic.com.
  advisor:
    name: yama_advisor
  # yama and yama-forge only, with no way out: Forge needs nothing from the internet.
  forge:
    name: yama_forge
    internal: true
