# Yama on saget (Unraid). Lives at /mnt/user/appdata/yama with this file, a server-local
# yama.env (not in git) and data/. See deploy/README.md.
services:
  yama:
    image: yama:latest
    container_name: yama
    restart: unless-stopped
    user: "99:100"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: yama.env
    volumes:
      - ./data:/data
    ports:
      # LAN access; the public route goes through the existing Cloudflare tunnel.
      - "<saget-lan-address>:8099:8787"
    networks: [tunnel, advisor]
    mem_limit: 3g
  # "Ask Claude" (deploy/Dockerfile.advisor). No published port: only yama reaches it, on the
  # private advisor network. advisor.env (server-local, mode 0600) holds ADVISOR_SECRET, which
  # deploy.sh makes, and Bryan's CLAUDE_CODE_OAUTH_TOKEN, which deploy/advisor-token.sh writes.
  yama-advisor:
    image: yama-advisor:latest
    container_name: yama-advisor
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file: advisor.env
    networks: [advisor]
    mem_limit: 2g
    pids_limit: 256
networks:
  tunnel:
    external: true
    name: novalyst_default
  # yama and yama-advisor only. A plain bridge, because the advisor reaches api.anthropic.com.
  advisor:
    name: yama_advisor
