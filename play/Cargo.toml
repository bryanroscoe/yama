[package]
name = "yama-play"
version = "0.1.0"
edition = "2024"
publish = false
# tests/integration.rs gathers every integration test into one binary (see there).
autotests = false
description = "Online play for Yama: the phase-rs rules engine behind a small interface, plus an all-AI soak test."

[dependencies]
# Public bryanroscoe/yama-phase checkout; deploy/phase-repo and deploy/phase-rev pin releases.
# See docs/engine-integration.md and docs/engine-recovery-2026-10-25.md.
engine = { path = "../../yama-phase/crates/engine", package = "phase-engine" }
phase-ai = { path = "../../yama-phase/crates/phase-ai" }
phase-llm = { path = "../../yama-phase/crates/phase-llm" }
# phase-server's protocol and per-seat filter, for phase's own board on Yama games (src/board.rs).
server-core = { path = "../../yama-phase/crates/server-core" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Allocator for the lab runner only (declared in src/bin/lab.rs); already in the graph via phase-ai.
mimalloc = "0.1"
# The lab runner's per-thread CPU clock (clock_gettime); already in the graph.
libc = "0.2"

sha2 = "0.11.1"

# These tools have no unit tests. Without `test = false`, `cargo test` builds and links a
# second, test-harness copy of each against the whole engine, which costs CI minutes.
[[bin]]
name = "coverage"
test = false

[[bin]]
name = "labtrace"
test = false

[[bin]]
name = "loadbench"
test = false

[[bin]]
name = "playbench"
test = false

[[bin]]
name = "referee"
test = false

[[bin]]
name = "soak"
test = false

[[test]]
name = "integration"
path = "tests/integration.rs"
