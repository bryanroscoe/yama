[package]
name = "yama-play"
version = "0.1.0"
edition = "2024"
publish = false
description = "Online play for Yama: the phase-rs rules engine behind a small interface, plus an all-AI soak test."

[dependencies]
# Local fork of phase v0.113.0; patches/phase and deploy/phase-rev pin the changes.
# See docs/engine-integration.md and docs/engine-recovery-2026-10-25.md.
engine = { path = "../../yama-phase/crates/engine", package = "phase-engine" }
phase-ai = { path = "../../yama-phase/crates/phase-ai" }
phase-llm = { path = "../../yama-phase/crates/phase-llm" }
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# Allocator for the lab runner only (declared in src/bin/lab.rs); already in the graph via phase-ai.
mimalloc = "0.1"
# The lab runner's per-thread CPU clock (clock_gettime); already in the graph.
libc = "0.2"
