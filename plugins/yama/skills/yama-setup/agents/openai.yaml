interface:
  display_name: "Connect Yama"
  short_description: "Connect and verify your private Yama account"
  icon_small: "./assets/yama-icon-120.png"
  icon_large: "./assets/yama-logo-512.png"
  brand_color: "#0B0C0E"
  default_prompt: "Use $yama-setup to connect my Yama account and verify access."
dependencies:
  tools:
    - type: "mcp"
      value: "yama"
      description: "Read Yama decks, collection and plans; stage requested changes"
      transport: "streamable_http"
      url: "https://yama.ing/mcp"
