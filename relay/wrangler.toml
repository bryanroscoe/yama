# Yama's shared-table relay. Deploy notes: relay/README.md.
name = "yama-relay"
main = "src/index.ts"
# Bryan's Cloudflare account (the yama.ing zone).
account_id = "cb1237c6aab19beb18e9545ac846f9eb"
compatibility_date = "2026-10-01"

# Only relay.yama.ing; no workers.dev address.
workers_dev = false
routes = [{ pattern = "relay.yama.ing", custom_domain = true }]

# Phones joining by code (guests): "off" refuses them, the switch if it's abused. Change it here
# and deploy, or in the dashboard (Workers, yama-relay, Settings, Variables).
[vars]
GUEST_JOIN = "on"

# Connections per client address per minute, per Cloudflare location, counted before any room
# is touched. A table on one Wi-Fi is a few phones reconnecting now and then.
[[ratelimits]]
name = "CONNECTS"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

# Messages per client address and role per minute across all its sockets and rooms (hosts and
# guests apart, so a table's guests on one Wi-Fi can't cut off its host). The day's allowance is
# 100,000 requests, incoming WebSocket messages count 20 to 1, and the WAF rule's requests share
# it (waf-rule.py): 400 a minute for each role is at most 57,600 a day, which with the WAF rule's
# 34,600 keeps one address under the day. A host resends the game on each change, a few a second
# at a busy table; one over the minute's share is closed and reconnects.
[[ratelimits]]
name = "MESSAGES"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 400
  period = 60

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "TableRoom"

# SQLite-backed, the only kind on the Workers Free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["TableRoom"]

# No request logs: connection URLs carry host secrets.
[observability]
enabled = false
